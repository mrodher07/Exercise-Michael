# Compila el APK de Android y lo deja descargable.
#
# Existe por una razón muy concreta: para instalar la aplicación en un móvil hace falta un
# APK, y compilarlo pide el SDK de Android (unos gigas, y `dl.google.com` no siempre está
# accesible según dónde se trabaje). Aquí lo hace GitHub, que ya trae el SDK instalado en sus
# máquinas.
#
# El APK sale por tres caminos, y el bueno para el móvil es el primero:
#
#   · Como Release de un **repositorio público aparte** (`mrodher07/fitlog-apk`), que sólo
#     contiene el APK. Ése es el que se puede descargar desde el móvil **sin iniciar sesión**,
#     y es el único que funciona bien: en un repositorio privado la descarga va autenticada,
#     y el gestor de descargas de Android se atasca —la barra llega al 100 % y la descarga no
#     termina nunca— porque el archivo viaja detrás de una redirección con sesión.
#   · Como Release de la etiqueta «apk» de este repositorio, que sigue ahí como respaldo.
#   · Como artefacto del propio flujo, que es un zip y caduca a los 90 días. Se queda por si
#     hace falta el APK de una compilación concreta.
#
# Para las siguientes veces basta con instalar el APK nuevo encima: los datos se conservan
# porque van en la carpeta de la aplicación, no en el APK, y porque todos los APK que salen de
# aquí se firman con la misma clave (`movil/android/app/fitlog.jks`). Con una clave distinta en
# cada compilación —que es lo que pasa con la de depuración, que se genera nueva en cada
# máquina— Android trataría el APK nuevo como otra aplicación y no lo dejaría instalar encima.

name: APK de Android

on:
  push:
    branches: ['**']
    paths:
      - 'movil/**'
      - '.github/workflows/apk.yml'
  # Y a mano, cuando quieras un APK sin haber tocado nada.
  workflow_dispatch:

# Una compilación a la vez, y si llega otra se cancela la que estaba.
#
# Todas las ejecuciones escriben en el **mismo** archivo del mismo Release, así que dos a la
# vez —lo que pasa, por ejemplo, al empujar el mismo commit a una rama y a `main`— pueden
# pisarse subiendo el APK. Además la que se cancela no aporta nada: la que la adelanta trae
# ese commit o uno más nuevo.
concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    # Para poder publicar el Release. Sin esto el permiso por defecto puede ser de sólo
    # lectura y `gh release` falla con un 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: movil
        run: flutter pub get

      # El análisis y las pruebas van antes de compilar: si algo está roto, mejor saberlo
      # aquí que al abrir la aplicación en el móvil.
      - name: Analizar
        working-directory: movil
        run: flutter analyze

      - name: Pruebas
        working-directory: movil
        run: flutter test

      - name: Compilar el APK
        working-directory: movil
        run: flutter build apk --release

      # El camino bueno para instalarlo en el móvil: un Release con el APK suelto dentro.
      #
      # Es **un solo Release** que se va reescribiendo, con la etiqueta fija «apk», y no uno
      # por compilación. Así el enlace `/releases/latest/download/fitlog.apk` siempre trae el
      # último APK y se puede guardar en favoritos del móvil, en vez de tener que buscar cada
      # vez cuál es la última ejecución. El historial de versiones ya está en los commits; una
      # lista de APK viejos no le sirve a nadie.
      #
      # Se publica después de analizar, pasar las pruebas y compilar, así que lo que hay ahí
      # colgado nunca es una versión que no arranque. Ojo con esto: cualquier rama que toque
      # `movil/` y llegue verde hasta aquí reescribe el APK del Release.
      - name: Publicar el APK en el Release «apk»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Se renombra a fitlog.apk: el nombre del archivo es la mitad del enlace fijo, así
          # que tiene que ser siempre el mismo.
          cp movil/build/app/outputs/flutter-apk/app-release.apk fitlog.apk
          notas=$(cat <<TEXTO
          APK de FitLog compilado desde \`${GITHUB_SHA:0:7}\` el $(date -u '+%d/%m/%Y a las %H:%M UTC').

          **Descarga directa:** [fitlog.apk](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/fitlog.apk) — este enlace siempre trae el último.

          ### Instalar
          1. Toca el enlace en el móvil y descarga el archivo.
          2. Ábrelo. Android pedirá permiso para instalar aplicaciones de fuera de Play Store:
             se lo das a la aplicación desde la que lo abras (el navegador o el explorador de
             archivos).
          3. Si sale Play Protect, «Instalar de todas formas». Es tu propia aplicación.

          Para actualizar, instala el APK nuevo encima: **los entrenos no se van**, porque
          viven en la carpeta de la aplicación y todos los APK van firmados con la misma clave.
          TEXTO
          )
          if gh release view apk >/dev/null 2>&1; then
            # Se actualizan las notas y se pisa el archivo, en vez de borrar el Release y
            # crearlo otra vez: así el enlace de descarga nunca se queda sin APK detrás, ni
            # medio segundo. La etiqueta «apk» sigue apuntando al commit donde se creó —una
            # etiqueta que ya existe no se mueve—, y por eso el commit de verdad va escrito
            # en las notas.
            gh release edit apk --notes "$notas"
            gh release upload apk fitlog.apk --clobber
          else
            gh release create apk fitlog.apk \
              --title 'FitLog · último APK' \
              --notes "$notas" \
              --target "$GITHUB_SHA"
          fi

      # El camino que de verdad funciona en el móvil: el mismo APK, en el Release de un
      # repositorio público que sólo contiene esto.
      #
      # Hace falta porque una descarga de un repositorio privado va autenticada, y el gestor
      # de descargas de Android no siempre lleva la sesión por la redirección a
      # `objects.githubusercontent.com`: la barra llega al 100 % y la descarga se queda «en
      # curso» para siempre, sin poder abrir el archivo. Desde un repositorio público es una
      # descarga normal y corriente, sin sesión de por medio. El código sigue privado; ahí
      # sólo va el APK.
      #
      # El secreto `TOKEN_APK` es necesario porque el `github.token` del flujo sólo vale para
      # este repositorio. Mientras no esté puesto, este paso se salta y no rompe nada: el APK
      # sigue saliendo por los otros dos caminos.
      - name: Publicar el APK donde se descargue sin sesión
        env:
          GH_TOKEN: ${{ secrets.TOKEN_APK }}
          REPO_APK: mrodher07/fitlog-apk
        run: |
          set -euo pipefail
          # El «me lo salto» va aquí dentro y no en un `if:` del paso para que quede escrito
          # en el registro de la ejecución: un paso saltado sin explicación es media hora
          # buscando por qué no se ha publicado nada.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'Sin el secreto TOKEN_APK: me salto la publicación en el repositorio'
            echo 'público. El APK está en el Release de este repositorio y en los artefactos.'
            exit 0
          fi
          if ! gh repo view "$REPO_APK" >/dev/null 2>&1; then
            # Un 404 de GitHub no distingue «ese repositorio no existe» de «existe y este
            # token no lo ve», y el arreglo no es el mismo. Se pregunta dos veces: una sin
            # credenciales —que contesta por la existencia y por si es público— y otra con el
            # token, para saber a quién pertenece.
            publico=$(curl -s -o /dev/null -w '%{http_code}' "https://api.github.com/repos/$REPO_APK")
            duenno=$(gh api user --jq .login 2>/dev/null || echo '(el token no identifica a nadie)')
            echo "El token de TOKEN_APK no ve el repositorio $REPO_APK." >&2
            echo >&2
            echo "Sin autenticar, la API contesta $publico para ese repositorio:" >&2
            echo "  · 200 → existe y es público, así que el problema es el token: en su" >&2
            echo "          «Repository access» tiene que estar ese repositorio, y en" >&2
            echo "          «Contents» permiso de lectura y escritura." >&2
            echo "  · 404 → no existe con ese nombre exacto, o es privado. Créalo público" >&2
            echo "          como $REPO_APK, o cambia REPO_APK en este flujo." >&2
            echo >&2
            echo "El token dice pertenecer a: $duenno" >&2
            exit 1
          fi
          # Una etiqueta necesita algo a lo que apuntar, y un repositorio recién creado sin
          # README no tiene ni un commit. Se avisa aquí porque el error de `gh` en ese caso
          # («Not Found») no dice nada de esto.
          if ! gh api "repos/$REPO_APK/commits?per_page=1" >/dev/null 2>&1; then
            echo "El repositorio $REPO_APK está vacío y una etiqueta necesita al menos un" >&2
            echo "commit. Añádele un README y vuelve a lanzar esta acción." >&2
            exit 1
          fi
          notas="APK de FitLog compilado desde \`${GITHUB_SHA:0:7}\` el $(date -u '+%d/%m/%Y a las %H:%M UTC'). El código está en un repositorio privado; aquí sólo se publica el APK para poder instalarlo en el móvil."
          if gh release view apk --repo "$REPO_APK" >/dev/null 2>&1; then
            gh release edit apk --repo "$REPO_APK" --notes "$notas"
            gh release upload apk fitlog.apk --repo "$REPO_APK" --clobber
          else
            gh release create apk fitlog.apk \
              --repo "$REPO_APK" \
              --title 'FitLog · último APK' \
              --notes "$notas"
          fi

      # Y el mismo APK como artefacto del flujo, por si algún día hace falta el de una
      # compilación concreta y no el último.
      - name: Dejar el APK descargable también aquí
        uses: actions/upload-artifact@v4
        with:
          name: fitlog-apk
          path: movil/build/app/outputs/flutter-apk/app-release.apk
          # Noventa días es lo máximo que guarda GitHub; de todas formas, con volver a
          # lanzar la acción se genera otro.
          retention-days: 90
